# Publishes accepted main to the irrwisch Worker. Adopted from the Wolf Ops product-website creation asset.
# Not active until the repository carries CLOUDFLARE_API_TOKEN, WOLFSBLVT_LEGAL_OPERATOR_B64,
# CLOUDFLARE_ACCOUNT_ID and WEBSITE_TARGET=workers (see docs/DEPLOYMENT.md).
name: Product website
on:
  push:
    branches: [main]
    paths: &website_paths
      - 'website/src/**'
      - 'website/worker/**'
      - 'website/public/**'
      - 'website/scripts/**'
      - 'website/tests/**'
      - 'website/astro.config.mjs'
      - 'website/site.config.mjs'
      - 'website/tsconfig.json'
      - 'website/tsconfig.worker.json'
      - 'website/package.json'
      - 'website/package-lock.json'
      - 'website/.node-version'
      - 'website/wrangler.jsonc'
      - '.github/workflows/product-website.yml'
  pull_request:
    branches: [main]
    paths: *website_paths
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_ROOT: website
  WEBSITE_TARGET: ${{ vars.WEBSITE_TARGET }}

jobs:
  website:
    runs-on: ubuntu-latest
    # Do not cancel a needed deployment merely because a later push arrives.
    concurrency:
      group: product-website-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A production job resolves current main after entering its concurrency slot.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
      - name: Record the source actually built
        shell: bash
        run: |
          printf 'Website source commit: %s\n' "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.SITE_ROOT }}/.node-version
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: ${{ env.SITE_ROOT }}
        run: npm ci
      - name: Check, test and build
        working-directory: ${{ env.SITE_ROOT }}
        run: npm test
      - name: Publish accepted main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.SITE_ROOT }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WOLFSBLVT_LEGAL_OPERATOR_B64: ${{ secrets.WOLFSBLVT_LEGAL_OPERATOR_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WEBSITE_TARGET" = "workers"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$WOLFSBLVT_LEGAL_OPERATOR_B64"
          test -x node_modules/.bin/wrangler
          npm run check:publish
          node_modules/.bin/wrangler deploy --config wrangler.jsonc
